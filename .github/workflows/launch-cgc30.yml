name: Launch CGC30 Landing Page

on:
  schedule:
    - cron: '5 3 * * 0' # Domingo 00:05 BRT / 03:05 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify launch date
        run: |
          TODAY=$(date -u +%Y-%m-%d)

          if [ "$TODAY" != "2026-06-21" ]; then
            echo "Not launch day. Today is $TODAY."
            exit 0
          fi

      - name: Switch landing page
        run: |
          if [ -f index.html ]; then
            mv index.html index-prelaunch.html
          fi

          if [ -f em-breve.html ]; then
            mv em-breve.html index.html
          else
            echo "em-breve.html not found"
            exit 1
          fi

      - name: Commit and push launch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          git commit -m "Launch CGC30 landing page"
          git push